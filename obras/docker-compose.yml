services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_ENV: local
      DB_DRIVER: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obras360}
      DB_USER: ${DB_USER:-obras360_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MARIADB_DATABASE: ${DB_NAME:-obras360}
      MARIADB_USER: ${DB_USER:-obras360_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 7s
      timeout: 5s
      retries: 12
volumes:
  dbdata:
